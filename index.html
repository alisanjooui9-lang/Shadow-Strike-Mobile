<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shadow Strike — Lobby</title><style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02050a;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button{
  font:inherit;
  color:#fff;
  border:0;
  cursor:pointer;
}

/* ================= BACKGROUND ================= */

body{
  background:
    radial-gradient(circle at 50% 45%,#19344c 0%,#07121d 34%,#02050a 75%);
}

#lobby{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

/* grid */
.grid{
  position:absolute;
  inset:-20%;
  opacity:.20;
  background-image:
    linear-gradient(#38bfff16 1px,transparent 1px),
    linear-gradient(90deg,#38bfff16 1px,transparent 1px);
  background-size:55px 55px;
  transform:perspective(650px) rotateX(58deg);
  transform-origin:center bottom;
  animation:gridMove 8s linear infinite;
}

@keyframes gridMove{
  to{
    background-position:0 55px,55px 0;
  }
}

/* glow */
.coreGlow{
  position:absolute;
  left:50%;
  top:50%;
  width:55vw;
  height:55vw;
  max-width:620px;
  max-height:620px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#1caaff12;
  box-shadow:
    0 0 120px #18aaff18,
    inset 0 0 100px #18aaff0d;
  animation:pulseGlow 4s ease-in-out infinite;
}

@keyframes pulseGlow{
  50%{
    transform:translate(-50%,-50%) scale(1.08);
    opacity:.7;
  }
}

/* scan */
.scan{
  position:absolute;
  left:0;
  right:0;
  height:2px;
  top:-10px;
  background:linear-gradient(
    90deg,
    transparent,
    #32c5ff66,
    transparent
  );
  box-shadow:0 0 20px #26baff;
  animation:scanDown 6s linear infinite;
}

@keyframes scanDown{
  to{
    top:110%;
  }
}

/* particles */
.particle{
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#5bcfff;
  box-shadow:0 0 10px #22baff;
  opacity:.6;
  animation:floatParticle linear infinite;
}

@keyframes floatParticle{
  from{
    transform:translateY(110vh);
  }
  to{
    transform:translateY(-20vh);
  }
}

/* ================= TOP BAR ================= */

.topbar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:70px;
  z-index:30;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 16px;
  background:
    linear-gradient(
      180deg,
      #02060de8,
      transparent
    );
}

/* profile */
.profile{
  display:flex;
  align-items:center;
  gap:9px;
}

.avatar{
  width:44px;
  height:44px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    linear-gradient(
      145deg,
      #163348,
      #07121c
    );
  border:1px solid #42c8ff88;
  clip-path:polygon(
    10% 0,
    90% 0,
    100% 15%,
    100% 85%,
    90% 100%,
    10% 100%,
    0 85%,
    0 15%
  );
  font-size:22px;
  box-shadow:0 0 20px #1db5ff22;
}

.name{
  font-size:13px;
  font-weight:1000;
  letter-spacing:2px;
}

.rank{
  margin-top:3px;
  font-size:9px;
  color:#6e91aa;
  letter-spacing:1px;
}

.resources{
  display:flex;
  gap:7px;
}

.resource{
  min-width:82px;
  padding:9px 12px;
  background:#07121dde;
  border:1px solid #ffffff18;
  clip-path:polygon(
    8px 0,
    100% 0,
    100% calc(100% - 8px),
    calc(100% - 8px) 100%,
    0 100%,
    0 8px
  );
  font-size:12px;
  font-weight:900;
  text-align:center;
}

.resource:first-child{
  color:#ffd75a;
}

.resource:last-child{
  color:#9f83ff;
}

/* ================= LEFT MENU ================= */

.leftMenu{
  position:absolute;
  left:16px;
  top:105px;
  z-index:25;
  width:190px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

/* ================= RIGHT MENU ================= */

.rightMenu{
  position:absolute;
  right:16px;
  top:105px;
  z-index:25;
  width:190px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

/* tactical buttons */

.tactical{
  position:relative;
  width:100%;
  min-height:52px;
  padding:11px 14px;
  text-align:left;
  overflow:hidden;
  background:
    linear-gradient(
      90deg,
      #0a1825ee,
      #07101ae8
    );
  border:1px solid #ffffff1c;
  border-left:3px solid #2ebcff88;

  clip-path:polygon(
    0 0,
    calc(100% - 12px) 0,
    100% 12px,
    100% 100%,
    12px 100%,
    0 calc(100% - 12px)
  );

  transition:
    transform .18s,
    border-color .18s,
    background .18s,
    box-shadow .18s;
}

.tactical:hover{
  transform:translateX(4px);
  border-color:#38c5ff;
  box-shadow:
    0 0 25px #18aaff22,
    inset 0 0 20px #18aaff0b;
  background:
    linear-gradient(
      90deg,
      #103049ee,
      #081722ee
    );
}

.tactical:active{
  transform:scale(.96);
}

.tactical::after{
  content:"";
  position:absolute;
  left:-100%;
  top:0;
  width:80%;
  height:100%;
  background:linear-gradient(
    90deg,
    transparent,
    #4bd1ff18,
    transparent
  );
  animation:buttonScan 4s linear infinite;
}

@keyframes buttonScan{
  0%{left:-100%}
  45%{left:130%}
  100%{left:130%}
}

.icon{
  display:inline-block;
  width:28px;
  font-size:19px;
  vertical-align:middle;
}

.buttonText{
  vertical-align:middle;
  font-size:11px;
  font-weight:1000;
  letter-spacing:1.4px;
}

.buttonSub{
  display:block;
  margin-left:29px;
  margin-top:3px;
  color:#658096;
  font-size:8px;
  letter-spacing:.5px;
}

.badge{
  position:absolute;
  right:9px;
  top:8px;
  min-width:17px;
  height:17px;
  padding:0 4px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:4px;
  background:#ff4054;
  color:white;
  font-size:8px;
  font-weight:bold;
  box-shadow:0 0 12px #ff304444;
}

/* ================= OPERATOR ================= */

.operator{
  position:absolute;
  z-index:12;
  left:50%;
  top:49%;
  width:320px;
  height:430px;
  transform:translate(-50%,-50%);
  display:flex;
  align-items:center;
  justify-content:center;
}

.operatorAura{
  position:absolute;
  width:280px;
  height:280px;
  border-radius:50%;
  border:1px solid #31c3ff22;
  box-shadow:
    0 0 70px #19afff19,
    inset 0 0 50px #19afff0c;
  animation:rotateAura 15s linear infinite;
}

@keyframes rotateAura{
  to{
    transform:rotate(360deg);
  }
}

.operatorFigure{
  position:relative;
  z-index:2;
  width:180px;
  height:300px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:145px;
  filter:
    drop-shadow(0 20px 30px #000)
    drop-shadow(0 0 25px #1ebaff22);
  animation:operatorFloat 3.5s ease-in-out infinite;
}

@keyframes operatorFloat{
  50%{
    transform:translateY(-8px);
  }
}

.operatorName{
  position:absolute;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  font-size:12px;
  font-weight:1000;
  letter-spacing:4px;
  color:#c9e9f7;
}

.operatorLevel{
  position:absolute;
  bottom:-10px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  font-size:8px;
  color:#618198;
  letter-spacing:2px;
}

/* ================= EVENT ================= */

.event{
  position:absolute;
  z-index:18;
  left:50%;
  top:75px;
  transform:translateX(-50%);
  width:min(470px,42vw);
  min-width:300px;
  height:62px;
  padding:10px 16px;
  background:
    linear-gradient(
      100deg,
      #091c2cee,
      #102e42ee,
      #07121ce8
    );
  border:1px solid #3cc5ff55;
  clip-path:polygon(
    0 0,
    calc(100% - 15px) 0,
    100% 15px,
    100% 100%,
    15px 100%,
    0 calc(100% - 15px)
  );
  box-shadow:0 10px 40px #0007;
}

.eventTitle{
  color:#43caff;
  font-size:8px;
  letter-spacing:2px;
  font-weight:bold;
}

.eventMain{
  margin-top:5px;
  font-size:15px;
  font-weight:1000;
  letter-spacing:1px;
}

.eventTime{
  position:absolute;
  right:15px;
  bottom:11px;
  color:#ffcf5a;
  font-size:9px;
  font-weight:bold;
}

/* ================= START ================= */

.startArea{
  position:absolute;
  z-index:35;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  width:min(430px,42vw);
}

.startButton{
  position:relative;
  width:100%;
  height:66px;
  overflow:hidden;

  background:
    linear-gradient(
      90deg,
      #087aff,
      #18c6ff
    );

  clip-path:polygon(
    0 0,
    calc(100% - 18px) 0,
    100% 18px,
    100% 100%,
    18px 100%,
    0 calc(100% - 18px)
  );

  box-shadow:
    0 0 35px #149fff55,
    inset 0 0 30px #ffffff12;

  font-size:19px;
  font-weight:1000;
  letter-spacing:4px;
}

.startButton::before{
  content:"";
  position:absolute;
  left:-40%;
  top:0;
  width:35%;
  height:100%;
  transform:skewX(-20deg);
  background:#ffffff22;
  animation:startShine 2.8s linear infinite;
}

@keyframes startShine{
  to{
    left:130%;
  }
}

.startButton:active{
  transform:scale(.97);
}

.modeHint{
  margin-top:6px;
  text-align:center;
  color:#7791a6;
  font-size:8px;
  letter-spacing:2px;
}

/* ================= BOTTOM ================= */

.bottom{
  position:absolute;
  left:16px;
  right:16px;
  bottom:15px;
  z-index:28;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.bottomLeft,
.bottomRight{
  display:flex;
  gap:7px;
  pointer-events:auto;
}

.smallButton{
  min-width:75px;
  padding:9px 12px;
  background:#06101ae8;
  border:1px solid #ffffff18;
  clip-path:polygon(
    6px 0,
    100% 0,
    100% calc(100% - 6px),
    calc(100% - 6px) 100%,
    0 100%,
    0 6px
  );
  font-size:9px;
  font-weight:bold;
  color:#9ab0c1;
}

.smallButton:hover{
  color:white;
  border-color:#31bfff88;
}

/* ================= MODAL ================= */

.modal{
  position:absolute;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  background:#02060dee;
  backdrop-filter:blur(8px);
}

.modalBox{
  width:min(650px,90vw);
  max-height:85vh;
  overflow:auto;
  padding:25px;
  background:
    linear-gradient(
      145deg,
      #0b1c2a,
      #03080e
    );
  border:1px solid #2cbaff44;
  clip-path:polygon(
    0 0,
    calc(100% - 20px) 0,
    100% 20px,
    100% 100%,
    20px 100%,
    0 calc(100% - 20px)
  );
  box-shadow:0 30px 100px #000;
}

.modalTitle{
  font-size:25px;
  font-weight:1000;
  letter-spacing:3px;
  margin-bottom:18px;
}

.modalContent{
  color:#91a8b9;
  font-size:13px;
  line-height:1.8;
}

.close{
  float:right;
  width:34px;
  height:34px;
  background:#ffffff0b;
  border:1px solid #ffffff18;
}

/* ================= MOBILE ================= */

@media(max-width:850px){

  .leftMenu,
  .rightMenu{
    width:150px;
  }

  .tactical{
    min-height:44px;
    padding:8px 9px;
  }

  .buttonSub{
    display:none;
  }

  .icon{
    width:24px;
  }

  .buttonText{
    font-size:9px;
  }

  .operator{
    transform:translate(-50%,-50%) scale(.75);
  }

  .event{
    width:42vw;
  }

  .resource{
    min-width:65px;
    padding:7px;
    font-size:10px;
  }

  .avatar{
    width:38px;
    height:38px;
  }

  .name{
    font-size:10px;
  }
}

@media(max-height:500px){

  .topbar{
    height:55px;
  }

  .leftMenu,
  .rightMenu{
    top:72px;
    gap:5px;
  }

  .tactical{
    min-height:39px;
    padding:6px 8px;
  }

  .operator{
    transform:translate(-50%,-50%) scale(.58);
  }

  .event{
    top:58px;
    height:52px;
  }

  .startArea{
    bottom:8px;
  }

  .startButton{
    height:52px;
    font-size:15px;
  }

  .bottom{
    display:none;
  }
}
</style></head><body><div id="lobby">  <div class="grid"></div>
  <div class="coreGlow"></div>
  <div class="scan"></div>  <!-- PARTICLES -->  <div class="particle" style="left:8%;animation-duration:8s"></div>
  <div class="particle" style="left:18%;animation-duration:11s"></div>
  <div class="particle" style="left:29%;animation-duration:7s"></div>
  <div class="particle" style="left:43%;animation-duration:10s"></div>
  <div class="particle" style="left:58%;animation-duration:9s"></div>
  <div class="particle" style="left:72%;animation-duration:12s"></div>
  <div class="particle" style="left:86%;animation-duration:8s"></div>  <!-- TOP BAR -->  <header class="topbar"><div class="profile">

  <div class="avatar">
    👤
  </div>

  <div>
    <div class="name" id="playerName">
      GHOST
    </div>

    <div class="rank">
      LEVEL <span id="playerLevel">1</span>
      · ROOKIE
    </div>
  </div>

</div>

<div class="resources">

  <div class="resource">
    🪙 <span id="credits">1000</span>
  </div>

  <div class="resource">
    💎 <span id="sc">250</span>
  </div>

</div>

  </header>  <!-- LEFT MENU -->  <div class="leftMenu"><button class="tactical" onclick="openModal('loadout')">
  <span class="icon">🎒</span>
  <span class="buttonText">LOADOUT</span>
  <span class="buttonSub">EQUIPMENT</span>
</button>

<button class="tactical" onclick="openModal('missions')">
  <span class="icon">🎯</span>
  <span class="buttonText">MISSIONS</span>
  <span class="buttonSub">DAILY OBJECTIVES</span>
  <span class="badge">3</span>
</button>

<button class="tactical" onclick="openModal('battlepass')">
  <span class="icon">🏆</span>
  <span class="buttonText">BATTLE PASS</span>
  <span class="buttonSub">SEASON PROGRESS</span>
</button>

<button class="tactical" onclick="openModal('events')">
  <span class="icon">⚡</span>
  <span class="buttonText">EVENTS</span>
  <span class="buttonSub">LIMITED TIME</span>
</button>

  </div>  <!-- RIGHT MENU -->  <div class="rightMenu"><button class="tactical" onclick="openModal('shop')">
  <span class="icon">🛒</span>
  <span class="buttonText">SHOP</span>
  <span class="buttonSub">STORE</span>
  <span class="badge">!</span>
</button>

<button class="tactical" onclick="openModal('spin')">
  <span class="icon">🎡</span>
  <span class="buttonText">LUCKY SPIN</span>
  <span class="buttonSub">DAILY REWARD</span>
</button>

<button class="tactical" onclick="openModal('friends')">
  <span class="icon">👥</span>
  <span class="buttonText">FRIENDS</span>
  <span class="buttonSub">SOCIAL</span>
</button>

<button class="tactical" onclick="openModal('profile')">
  <span class="icon">👤</span>
  <span class="buttonText">PROFILE</span>
  <span class="buttonSub">PLAYER DATA</span>
</button>

  </div>  <!-- EVENT -->  <div class="event"><div class="eventTitle">
  LIVE EVENT
</div>

<div class="eventMain">
  SHADOW PROTOCOL
</div>

<div class="eventTime">
  05D 14H
</div>

  </div>  <!-- OPERATOR -->  <div class="operator"><div class="operatorAura"></div>

<div class="operatorFigure">
  🥷
</div>

<div class="operatorName">
  SHADOW-01
</div>

<div class="operatorLevel">
  ELITE OPERATOR
</div>

  </div>  <!-- START -->  <div class="startArea"><button class="startButton" onclick="startMatch()">
  ▶ START MATCH
</button>

<div class="modeHint">
  SELECT BATTLE MODE AFTER START
</div>

  </div>  <!-- BOTTOM -->  <div class="bottom"><div class="bottomLeft">

  <button class="smallButton"
          onclick="openModal('notifications')">
    🔔 NOTIFICATIONS
  </button>

</div>

<div class="bottomRight">

  <button class="smallButton"
          onclick="openModal('settings')">
    ⚙ SETTINGS
  </button>

</div>

  </div>  <!-- MODAL -->  <div class="modal" id="modal"><div class="modalBox">

  <button class="close"
          onclick="closeModal()">
    ✕
  </button>

  <div class="modalTitle"
       id="modalTitle">
    MENU
  </div>

  <div class="modalContent"
       id="modalContent">
  </div>

</div>

  </div></div><script>

/* ================= PLAYER ================= */

const saveKey = "shadowStrike";

let player =
  JSON.parse(
    localStorage.getItem(saveKey) || "{}"
  );

if(!player.playerName)
  player.playerName="GHOST";

if(!player.level)
  player.level=1;

if(player.xp===undefined)
  player.xp=0;

if(player.credits===undefined)
  player.credits=1000;

if(player.sc===undefined)
  player.sc=250;

function save(){
  localStorage.setItem(
    saveKey,
    JSON.stringify(player)
  );
}

function updatePlayer(){

  document.getElementById(
    "playerName"
  ).textContent =
    player.playerName;

  document.getElementById(
    "playerLevel"
  ).textContent =
    player.level;

  document.getElementById(
    "credits"
  ).textContent =
    player.credits;

  document.getElementById(
    "sc"
  ).textContent =
    player.sc;

}

updatePlayer();


/* ================= START ================= */

function startMatch(){

  window.location.href =
    "game.html";

}


/* ================= MODALS ================= */

const content = {

  loadout:`
    <b>LOADOUT</b><br><br>
    Operator: SHADOW-01<br>
    Ability: ENERGY PULSE<br>
    Core: STANDARD<br><br>
    Your loadout is ready.
  `,

  missions:`
    <b>DAILY MISSIONS</b><br><br>
    🎯 Complete 3 Arena objectives<br>
    ⭐ Earn 500 XP<br>
    🪙 Earn 1000 Credits<br><br>
    Rewards available.
  `,

  battlepass:`
    <b>SEASON PASS</b><br><br>
    LEVEL 01<br>
    █████░░░░░ 45%<br><br>
    Next reward: Credits + XP
  `,

  events:`
    <b>SHADOW PROTOCOL</b><br><br>
    Limited-time event active.<br>
    Complete Arena objectives to earn rewards.
  `,

  shop:`
    <b>SHOP</b><br><br>
    🧊 Neon Operator — 500 SC<br><br>
    ⚡ Energy Effect — 300 SC<br><br>
    🎨 Arena Theme — 200 SC
  `,

  spin:`
    <b>LUCKY SPIN</b><br><br>
    Daily free reward available.<br><br>
    🎁 Possible rewards:<br>
    Credits · XP · Cosmetic Items
  `,

  friends:`
    <b>FRIENDS</b><br><br>
    🟢 ShadowFox — Online<br>
    🟢 NightByte — Online<br>
    ⚪ ZeroCore — Offline
  `,

  profile:`
    <b>${player.playerName}</b><br><br>
    LEVEL: ${player.level}<br>
    XP: ${player.xp}<br>
    CREDITS: ${player.credits}<br>
    SC: ${player.sc}
  `,

  notifications:`
    <b>NOTIFICATIONS</b><br><br>
    🔔 New daily missions<br>
    🎁 Reward available<br>
    ⚡ Shadow Protocol event active
  `,

  settings:`
    <b>SETTINGS</b><br><br>
    🎮 Controls<br>
    🔊 Audio<br>
    ✨ Graphics<br>
    📳 Vibration<br>
    🎯 Sensitivity
  `

};


function openModal(type){

  document.getElementById(
    "modalTitle"
  ).textContent =
    type.toUpperCase();

  document.getElementById(
    "modalContent"
  ).innerHTML =
    content[type] || "";

  document.getElementById(
    "modal"
  ).style.display =
    "flex";

}


function closeModal(){

  document.getElementById(
    "modal"
  ).style.display =
    "none";

}


/* ================= ESC ================= */

document.addEventListener(
  "keydown",
  e=>{

    if(e.key==="Escape")
      closeModal();

  }
);

</script></body>
</html>
