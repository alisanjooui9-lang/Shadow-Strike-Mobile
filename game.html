<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shadow Strike - 3D Field</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05080c;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

/* HUD */

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
}

.top{
    position:absolute;
    top:12px;
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.box{
    background:rgba(3,8,14,.72);
    border:1px solid rgba(0,220,255,.45);
    padding:9px 13px;
    border-radius:6px;
    backdrop-filter:blur(5px);
}

.hp{
    color:#42f5a7;
    font-size:13px;
    font-weight:bold;
}

.energy{
    color:#35dfff;
    font-size:12px;
    margin-top:5px;
}

.map{
    width:110px;
    height:75px;
    border:1px solid rgba(0,220,255,.55);
    background:rgba(0,10,18,.75);
    position:relative;
}

.map:before,
.map:after{
    content:"";
    position:absolute;
    background:rgba(0,220,255,.18);
}

.map:before{
    width:100%;
    height:1px;
    top:50%;
}

.map:after{
    height:100%;
    width:1px;
    left:50%;
}

.playerDot{
    position:absolute;
    left:50%;
    top:50%;
    width:7px;
    height:7px;
    background:#00efff;
    border-radius:50%;
    box-shadow:0 0 8px #00efff;
}

/* CROSSHAIR */

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:28px;
    height:28px;
    transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:rgba(255,255,255,.85);
}

#crosshair:before{
    width:1px;
    height:28px;
    left:13px;
}

#crosshair:after{
    height:1px;
    width:28px;
    top:13px;
}

/* MOBILE CONTROLS */

#controls{
    position:absolute;
    inset:0;
}

#joystick{
    position:absolute;
    left:25px;
    bottom:25px;
    width:125px;
    height:125px;
    border:2px solid rgba(0,220,255,.4);
    border-radius:50%;
    background:rgba(0,10,18,.28);
}

#stick{
    position:absolute;
    left:50%;
    top:50%;
    width:60px;
    height:60px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(0,190,230,.25);
    border:2px solid rgba(0,230,255,.7);
    box-shadow:0 0 20px rgba(0,220,255,.25);
}

.action{
    position:absolute;
    width:67px;
    height:67px;
    border-radius:50%;
    border:1px solid rgba(0,230,255,.7);
    background:rgba(3,12,21,.72);
    color:white;
    font-size:22px;
    box-shadow:0 0 18px rgba(0,220,255,.18);
}

#ability{
    right:30px;
    bottom:32px;
}

#shield{
    right:108px;
    bottom:70px;
}

#scan{
    right:185px;
    bottom:38px;
}

#exit{
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    padding:8px 15px;
    border:1px solid rgba(255,255,255,.3);
    background:rgba(0,0,0,.55);
    color:white;
    border-radius:5px;
    pointer-events:auto;
}

/* LOADING */

#loading{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#04070c;
    color:#00eaff;
    letter-spacing:3px;
}

.loader{
    width:190px;
    height:4px;
    margin-top:18px;
    background:#182331;
    overflow:hidden;
}

.loader i{
    display:block;
    height:100%;
    width:40%;
    background:#00eaff;
    animation:load 1.2s infinite;
}

@keyframes load{
    from{transform:translateX(-100%)}
    to{transform:translateX(500%)}
}

@media(max-height:430px){

    #joystick{
        width:100px;
        height:100px;
        bottom:15px;
        left:18px;
    }

    #stick{
        width:48px;
        height:48px;
    }

    .action{
        width:55px;
        height:55px;
    }

    #ability{
        right:20px;
        bottom:18px;
    }

    #shield{
        right:82px;
        bottom:55px;
    }

    #scan{
        right:145px;
        bottom:18px;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
    SHADOW STRIKE
    <div style="font-size:10px;margin-top:8px;color:#71869c">
        LOADING 3D FIELD
    </div>
    <div class="loader"><i></i></div>
</div>

<div id="hud">

    <div class="top">

        <div class="box">
            <div class="hp">◆ HP 100</div>
            <div class="energy">⚡ ENERGY 100</div>
        </div>

        <div class="map">
            <div class="playerDot"></div>
        </div>

    </div>

    <div id="crosshair"></div>

    <button id="exit">× EXIT</button>

    <div id="controls">

        <div id="joystick">
            <div id="stick"></div>
        </div>

        <button class="action" id="ability">⚡</button>
        <button class="action" id="shield">🛡️</button>
        <button class="action" id="scan">📡</button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>

/* =====================================
   SHADOW STRIKE 3D FIELD
===================================== */

let scene;
let camera;
let renderer;

let clock = new THREE.Clock();

let velocity = new THREE.Vector3();

let moveForward = false;
let moveBackward = false;
let moveLeft = false;
let moveRight = false;

let yaw = 0;
let pitch = 0;

let touchLook = null;
let joystickTouch = null;

const worldSize = 1800;


/* =====================================
   START
===================================== */

function init(){

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x07101a);

    scene.fog =
        new THREE.Fog(
            0x07101a,
            180,
            900
        );


    /* CAMERA */

    camera = new THREE.PerspectiveCamera(
        72,
        innerWidth / innerHeight,
        0.1,
        1800
    );

    camera.position.set(
        0,
        3.2,
        180
    );


    /* RENDERER */

    renderer =
        new THREE.WebGLRenderer({
            antialias:true,
            powerPreference:"high-performance"
        });

    renderer.setPixelRatio(
        Math.min(devicePixelRatio,1.5)
    );

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;

    document
        .getElementById("game")
        .appendChild(renderer.domElement);


    /* LIGHT */

    const hemi =
        new THREE.HemisphereLight(
            0x9bc9ff,
            0x172015,
            1.7
        );

    scene.add(hemi);


    const sun =
        new THREE.DirectionalLight(
            0xffffff,
            2.2
        );

    sun.position.set(
        -250,
        400,
        180
    );

    sun.castShadow = true;

    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;

    sun.shadow.camera.left = -500;
    sun.shadow.camera.right = 500;
    sun.shadow.camera.top = 500;
    sun.shadow.camera.bottom = -500;

    scene.add(sun);


    createTerrain();

    createCity();

    createRoads();

    createProps();

    createSkyDetails();


    setupControls();

    window.addEventListener(
        "resize",
        resize
    );


    setTimeout(()=>{

        document.getElementById(
            "loading"
        ).style.display="none";

    },1200);


    animate();
}


/* =====================================
   TERRAIN
===================================== */

function createTerrain(){

    const groundGeometry =
        new THREE.PlaneGeometry(
            worldSize,
            worldSize,
            100,
            100
        );

    const groundMaterial =
        new THREE.MeshStandardMaterial({
            color:0x18241b,
            roughness:1
        });

    const ground =
        new THREE.Mesh(
            groundGeometry,
            groundMaterial
        );

    ground.rotation.x =
        -Math.PI/2;

    ground.receiveShadow = true;

    scene.add(ground);


    /* GRID */

    const grid =
        new THREE.GridHelper(
            worldSize,
            180,
            0x263a32,
            0x15231f
        );

    grid.position.y=.02;

    grid.material.transparent=true;
    grid.material.opacity=.22;

    scene.add(grid);
}


/* =====================================
   CITY
===================================== */

function createCity(){

    const positions = [

        [-330,-260,120,80,100],
        [-160,-290,90,100,150],
        [40,-300,130,90,110],
        [240,-260,90,120,170],

        [-390,-70,100,100,130],
        [-220,-80,130,90,90],
        [40,-80,90,100,150],
        [260,-60,130,100,120],

        [-330,120,100,80,170],
        [-120,130,120,110,110],
        [110,120,90,100,160],
        [310,130,120,90,100],

        [-250,310,150,100,130],
        [20,300,100,120,180],
        [260,300,130,90,130]

    ];


    positions.forEach(
        data=>{
            createBuilding(
                data[0],
                data[1],
                data[2],
                data[3],
                data[4]
            );
        }
    );
}


function createBuilding(
    x,
    z,
    width,
    depth,
    height
){

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:
                Math.random()>.5
                ?0x27323b
                :0x202b35,

            roughness:.85
        });

    const building =
        new THREE.Mesh(
            geometry,
            material
        );

    building.position.set(
        x,
        height/2,
        z
    );

    building.castShadow=true;
    building.receiveShadow=true;

    scene.add(building);


    /* ROOF */

    const roofGeometry =
        new THREE.BoxGeometry(
            width+5,
            4,
            depth+5
        );

    const roofMaterial =
        new THREE.MeshStandardMaterial({
            color:0x101820
        });

    const roof =
        new THREE.Mesh(
            roofGeometry,
            roofMaterial
        );

    roof.position.set(
        x,
        height+2,
        z
    );

    roof.castShadow=true;

    scene.add(roof);


    /* WINDOWS */

    const windowMaterial =
        new THREE.MeshBasicMaterial({
            color:0x35d9ff
        });

    for(
        let yy=18;
        yy<height-8;
        yy+=18
    ){

        for(
            let xx=-width/2+12;
            xx<width/2-5;
            xx+=22
        ){

            const w =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        8,
                        7,
                        .5
                    ),
                    windowMaterial
                );

            w.position.set(
                x+xx,
                yy,
                z-depth/2-.3
            );

            scene.add(w);
        }
    }
}


/* =====================================
   ROADS
===================================== */

function createRoads(){

    const roadMaterial =
        new THREE.MeshStandardMaterial({
            color:0x10161b,
            roughness:.95
        });


    const roads = [

        [0,0,130,worldSize],

        [0,0,worldSize,130],

        [-350,0,70,worldSize],

        [350,0,70,worldSize],

        [0,-350,worldSize,70],

        [0,350,worldSize,70]

    ];


    roads.forEach(r=>{

        const mesh =
            new THREE.Mesh(
                new THREE.PlaneGeometry(
                    r[2],
                    r[3]
                ),
                roadMaterial
            );

        mesh.rotation.x =
            -Math.PI/2;

        mesh.position.set(
            r[0],
            .05,
            r[1]
        );

        scene.add(mesh);

    });


    /* ROAD LINES */

    const lineMaterial =
        new THREE.MeshBasicMaterial({
            color:0x58645e
        });

    for(
        let x=-850;
        x<850;
        x+=25
    ){

        const line =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    10,
                    .08,
                    1.5
                ),
                lineMaterial
            );

        line.position.set(
            x,
            .12,
            0
        );

        scene.add(line);
    }
}


/* =====================================
   PROPS
===================================== */

function createProps(){

    for(
        let i=0;
        i<170;
        i++
    ){

        const x =
            (Math.random()-.5)*1500;

        const z =
            (Math.random()-.5)*1500;


        /* CRATES */

        if(Math.random()<.45){

            const size =
                4+Math.random()*5;

            const crate =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        size,
                        size,
                        size
                    ),
                    new THREE.MeshStandardMaterial({
                        color:0x514b3b
                    })
                );

            crate.position.set(
                x,
                size/2,
                z
            );

            crate.castShadow=true;

            scene.add(crate);

        }


        /* TOWERS */

        else{

            const h =
                8+Math.random()*20;

            const pole =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        .7,
                        .9,
                        h,
                        8
                    ),
                    new THREE.MeshStandardMaterial({
                        color:0x252d32
                    })
                );

            pole.position.set(
                x,
                h/2,
                z
            );

            pole.castShadow=true;

            scene.add(pole);
        }
    }
}


/* =====================================
   SKY
===================================== */

function createSkyDetails(){

    const moon =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                45,
                32,
                32
            ),
            new THREE.MeshBasicMaterial({
                color:0x9dc8e6
            })
        );

    moon.position.set(
        -500,
        500,
        -700
    );

    scene.add(moon);


    /* DISTANT MOUNTAINS */

    for(
        let i=0;
        i<35;
        i++
    ){

        const h =
            60+Math.random()*180;

        const mountain =
            new THREE.Mesh(
                new THREE.ConeGeometry(
                    80+Math.random()*80,
                    h,
                    5
                ),
                new THREE.MeshStandardMaterial({
                    color:0x111b1c,
                    roughness:1
                })
            );

        const angle =
            i/35*Math.PI*2;

        const radius=700;

        mountain.position.set(
            Math.cos(angle)*radius,
            h/2,
            Math.sin(angle)*radius
        );

        scene.add(mountain);
    }
}


/* =====================================
   CONTROLS
===================================== */

function setupControls(){

    const joy =
        document.getElementById("joystick");

    const stick =
        document.getElementById("stick");


    joy.addEventListener(
        "touchstart",
        e=>{
            joystickTouch =
                e.changedTouches[0].identifier;
        }
    );


    joy.addEventListener(
        "touchmove",
        e=>{

            for(
                const t of e.changedTouches
            ){

                if(
                    t.identifier !==
                    joystickTouch
                ) continue;

                const rect =
                    joy.getBoundingClientRect();

                let dx =
                    t.clientX -
                    (rect.left+rect.width/2);

                let dy =
                    t.clientY -
                    (rect.top+rect.height/2);

                const max=38;

                const distance =
                    Math.sqrt(
                        dx*dx+dy*dy
                    );

                if(distance>max){

                    dx =
                        dx/distance*max;

                    dy =
                        dy/distance*max;
                }

                stick.style.left =
                    `calc(50% + ${dx}px)`;

                stick.style.top =
                    `calc(50% + ${dy}px)`;


                moveForward =
                    dy < -10;

                moveBackward =
                    dy > 10;

                moveLeft =
                    dx < -10;

                moveRight =
                    dx > 10;
            }
        }
    );


    joy.addEventListener(
        "touchend",
        ()=>{
            joystickTouch=null;

            stick.style.left="50%";
            stick.style.top="50%";

            moveForward=false;
            moveBackward=false;
            moveLeft=false;
            moveRight=false;
        }
    );


    document.addEventListener(
        "touchstart",
        e=>{

            if(
                e.target.closest("#joystick") ||
                e.target.closest(".action") ||
                e.target.id==="exit"
            ) return;

            const t=e.changedTouches[0];

            touchLook={
                id:t.identifier,
                x:t.clientX,
                y:t.clientY
            };
        }
    );


    document.addEventListener(
        "touchmove",
        e=>{

            if(!touchLook) return;

            for(
                const t of e.changedTouches
            ){

                if(
                    t.identifier !==
                    touchLook.id
                ) continue;

                const dx =
                    t.clientX-touchLook.x;

                const dy =
                    t.clientY-touchLook.y;


                yaw -= dx*.004;
                pitch -= dy*.003;

                pitch =
                    Math.max(
                        -1.35,
                        Math.min(1.35,pitch)
                    );


                touchLook.x=t.clientX;
                touchLook.y=t.clientY;
            }
        }
    );


    document.addEventListener(
        "touchend",
        e=>{

            for(
                const t of e.changedTouches
            ){

                if(
                    touchLook &&
                    t.identifier===
                    touchLook.id
                ){
                    touchLook=null;
                }
            }
        }
    );


    document.getElementById("exit")
        .onclick=()=>{
            location.href="index.html";
        };


    document.getElementById("ability")
        .onclick=()=>{
            flash("ENERGY PULSE");
        };


    document.getElementById("shield")
        .onclick=()=>{
            flash("SHIELD ACTIVE");
        };


    document.getElementById("scan")
        .onclick=()=>{
            flash("SCANNER ACTIVE");
        };
}


/* =====================================
   EFFECT
===================================== */

function flash(text){

    const old =
        document.getElementById("crosshair");

    old.style.transform =
        "translate(-50%,-50%) scale(1.8)";

    setTimeout(()=>{
        old.style.transform =
            "translate(-50%,-50%) scale(1)";
    },180);

    console.log(text);
}


/* =====================================
   UPDATE
===================================== */

function update(){

    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );

    const speed =
        75*delta;


    if(moveForward)
        velocity.z -= speed;

    if(moveBackward)
        velocity.z += speed;

    if(moveLeft)
        velocity.x -= speed;

    if(moveRight)
        velocity.x += speed;


    velocity.multiplyScalar(.82);


    const forward =
        new THREE.Vector3(
            Math.sin(yaw),
            0,
            Math.cos(yaw)
        );

    const right =
        new THREE.Vector3(
            Math.cos(yaw),
            0,
            -Math.sin(yaw)
        );


    camera.position.addScaledVector(
        forward,
        -velocity.z
    );

    camera.position.addScaledVector(
        right,
        velocity.x
    );


    /* BOUNDARIES */

    camera.position.x =
        THREE.MathUtils.clamp(
            camera.position.x,
            -worldSize/2+15,
            worldSize/2-15
        );

    camera.position.z =
        THREE.MathUtils.clamp(
            camera.position.z,
            -worldSize/2+15,
            worldSize/2-15
        );


    camera.position.y=3.2;


    camera.rotation.order="YXZ";

    camera.rotation.y=yaw;
    camera.rotation.x=pitch;
}


/* =====================================
   RENDER
===================================== */

function animate(){

    requestAnimationFrame(animate);

    update();

    renderer.render(
        scene,
        camera
    );
}


/* =====================================
   RESIZE
===================================== */

function resize(){

    camera.aspect =
        innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );
}


/* =====================================
   RUN
===================================== */

init();

</script>

</body>
</html>
