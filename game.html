<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1,
    maximum-scale=1,
    user-scalable=no,
    viewport-fit=cover"
>

<title>Shadow Strike 3D</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05080c;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}


/* ===============================
   LOADING
================================ */

#loading{
    position:fixed;
    inset:0;
    z-index:9999;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at center,
            #102331 0%,
            #05090e 55%,
            #020406 100%
        );

    color:#00eaff;

    transition:
        opacity .35s ease;
}

.loading-title{
    font-size:26px;
    font-weight:900;
    letter-spacing:5px;

    text-shadow:
        0 0 10px #00eaff,
        0 0 30px rgba(0,234,255,.4);
}

.loading-sub{
    margin-top:10px;

    font-size:11px;
    letter-spacing:3px;

    color:#8195a6;
}

.loader{
    width:220px;
    height:4px;

    margin-top:24px;

    overflow:hidden;

    background:#15212c;

    border-radius:10px;
}

.loader-bar{
    width:35%;
    height:100%;

    background:#00eaff;

    box-shadow:
        0 0 12px #00eaff;

    animation:
        loadingMove 1.1s infinite;
}

@keyframes loadingMove{

    0%{
        transform:translateX(-120%);
    }

    100%{
        transform:translateX(400%);
    }

}


/* ===============================
   ERROR
================================ */

#errorScreen{
    position:fixed;
    inset:0;

    z-index:10000;

    display:none;

    align-items:center;
    justify-content:center;

    text-align:center;

    background:#05080c;

    color:white;
}

.errorBox{
    width:min(90%,380px);

    padding:25px;

    border:
        1px solid
        rgba(0,234,255,.35);

    border-radius:12px;

    background:
        rgba(5,15,23,.95);

    box-shadow:
        0 0 30px
        rgba(0,220,255,.12);
}

.errorTitle{
    color:#ff5a68;

    font-size:20px;

    font-weight:bold;

    letter-spacing:2px;
}

.errorText{
    margin-top:12px;

    color:#94a5b4;

    font-size:12px;

    line-height:1.7;
}

.reload{
    margin-top:20px;

    padding:12px 25px;

    border:
        1px solid
        #00eaff;

    border-radius:7px;

    background:#07131c;

    color:#00eaff;

    font-weight:bold;
}


/* ===============================
   HUD
================================ */

#hud{
    position:fixed;
    inset:0;

    z-index:50;

    pointer-events:none;

    color:white;
}


/* TOP */

.top{
    position:absolute;

    top:
        calc(12px + env(safe-area-inset-top));

    left:15px;
    right:15px;

    display:flex;

    justify-content:space-between;

    align-items:flex-start;
}

.box{
    padding:10px 14px;

    min-width:125px;

    border:
        1px solid
        rgba(0,220,255,.45);

    border-radius:7px;

    background:
        rgba(3,8,14,.76);

    backdrop-filter:
        blur(6px);

    box-shadow:
        0 0 15px
        rgba(0,220,255,.08);
}

.title-small{
    font-size:9px;

    color:#6e8496;

    letter-spacing:2px;

    margin-bottom:7px;
}

.hp{
    color:#42f5a7;

    font-size:14px;

    font-weight:bold;
}

.energy{
    color:#35dfff;

    font-size:12px;

    margin-top:6px;
}


/* MINIMAP */

.map{
    width:112px;
    height:78px;

    border:
        1px solid
        rgba(0,220,255,.55);

    background:
        rgba(0,10,18,.78);

    position:relative;

    overflow:hidden;
}

.map:before,
.map:after{
    content:"";

    position:absolute;

    background:
        rgba(0,220,255,.18);
}

.map:before{
    width:100%;
    height:1px;

    left:0;
    top:50%;
}

.map:after{
    width:1px;
    height:100%;

    left:50%;
    top:0;
}

.map-grid{
    position:absolute;

    inset:0;

    opacity:.18;

    background-image:
        linear-gradient(
            rgba(0,220,255,.25) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,220,255,.25) 1px,
            transparent 1px
        );

    background-size:20px 20px;
}

.playerDot{
    position:absolute;

    left:50%;
    top:50%;

    width:8px;
    height:8px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:#00efff;

    box-shadow:
        0 0 8px #00efff,
        0 0 16px #00efff;
}


/* ===============================
   MISSION
================================ */

.mission{
    position:absolute;

    top:110px;
    left:50%;

    transform:
        translateX(-50%);

    padding:
        7px 14px;

    border:
        1px solid
        rgba(0,220,255,.25);

    background:
        rgba(0,8,15,.55);

    border-radius:5px;

    font-size:9px;

    letter-spacing:2px;

    color:#8ca6b7;
}


/* ===============================
   CROSSHAIR
================================ */

#crosshair{
    position:absolute;

    left:50%;
    top:50%;

    width:34px;
    height:34px;

    transform:
        translate(-50%,-50%);

    transition:
        transform .12s ease;
}

#crosshair:before,
#crosshair:after{
    content:"";

    position:absolute;

    background:
        rgba(255,255,255,.9);

    box-shadow:
        0 0 5px
        rgba(255,255,255,.5);
}

#crosshair:before{
    width:1px;
    height:34px;

    left:16px;
}

#crosshair:after{
    width:34px;
    height:1px;

    top:16px;
}


/* ===============================
   EXIT
================================ */

#exit{
    position:absolute;

    top:
        calc(12px + env(safe-area-inset-top));

    left:50%;

    transform:
        translateX(-50%);

    pointer-events:auto;

    padding:
        8px 15px;

    border:
        1px solid
        rgba(255,255,255,.28);

    border-radius:6px;

    background:
        rgba(0,0,0,.6);

    color:white;

    font-size:11px;

    font-weight:bold;
}


/* ===============================
   JOYSTICK
================================ */

#joystick{
    position:absolute;

    left:24px;

    bottom:
        calc(24px + env(safe-area-inset-bottom));

    width:125px;
    height:125px;

    border:
        2px solid
        rgba(0,220,255,.38);

    border-radius:50%;

    background:
        rgba(0,10,18,.28);

    pointer-events:auto;

    box-shadow:
        inset 0 0 25px
        rgba(0,220,255,.05);
}

#joystick:after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:2px;
    height:2px;

    transform:
        translate(-50%,-50%);

    background:#00eaff;

    box-shadow:
        0 0 8px #00eaff;
}

#stick{
    position:absolute;

    left:50%;
    top:50%;

    width:58px;
    height:58px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        rgba(0,190,230,.23);

    border:
        2px solid
        rgba(0,230,255,.72);

    box-shadow:
        0 0 20px
        rgba(0,220,255,.25);
}


/* ===============================
   ACTION BUTTONS
================================ */

.action{
    position:absolute;

    width:66px;
    height:66px;

    border-radius:50%;

    border:
        1px solid
        rgba(0,230,255,.7);

    background:
        rgba(3,12,21,.75);

    color:white;

    font-size:22px;

    pointer-events:auto;

    box-shadow:
        0 0 18px
        rgba(0,220,255,.18);
}

#ability{
    right:25px;

    bottom:
        calc(24px + env(safe-area-inset-bottom));
}

#shield{
    right:105px;

    bottom:
        calc(67px + env(safe-area-inset-bottom));
}

#scan{
    right:185px;

    bottom:
        calc(30px + env(safe-area-inset-bottom));
}


/* ===============================
   NOTIFICATION
================================ */

#notification{
    position:absolute;

    left:50%;
    bottom:25%;

    transform:
        translate(-50%,20px);

    opacity:0;

    padding:
        10px 18px;

    border:
        1px solid
        rgba(0,234,255,.5);

    border-radius:6px;

    background:
        rgba(3,10,17,.85);

    color:#00eaff;

    font-size:11px;

    letter-spacing:2px;

    transition:
        .25s ease;
}

#notification.show{
    opacity:1;

    transform:
        translate(-50%,0);
}


/* ===============================
   MOBILE LANDSCAPE
================================ */

@media(max-height:430px){

    .box{
        min-width:110px;

        padding:
            7px 10px;
    }

    .map{
        width:95px;
        height:62px;
    }

    .mission{
        top:80px;
    }

    #joystick{
        width:100px;
        height:100px;

        left:17px;

        bottom:
            calc(15px + env(safe-area-inset-bottom));
    }

    #stick{
        width:48px;
        height:48px;
    }

    .action{
        width:55px;
        height:55px;
    }

    #ability{
        right:18px;
        bottom:
            calc(15px + env(safe-area-inset-bottom));
    }

    #shield{
        right:80px;
        bottom:
            calc(52px + env(safe-area-inset-bottom));
    }

    #scan{
        right:142px;
        bottom:
            calc(18px + env(safe-area-inset-bottom));
    }
}


/* ===============================
   PORTRAIT
================================ */

@media(orientation:portrait){

    .mission{
        top:105px;
    }

    #joystick{
        width:110px;
        height:110px;
    }

    #stick{
        width:52px;
        height:52px;
    }
}

</style>
</head>

<body>


<div id="game"></div>


<!-- LOADING -->

<div id="loading">

    <div class="loading-title">
        SHADOW STRIKE
    </div>

    <div class="loading-sub">
        INITIALIZING 3D FIELD
    </div>

    <div class="loader">
        <div class="loader-bar"></div>
    </div>

</div>


<!-- ERROR -->

<div id="errorScreen">

    <div class="errorBox">

        <div class="errorTitle">
            3D ENGINE ERROR
        </div>

        <div
            class="errorText"
            id="errorText"
        >
            Unable to initialize 3D engine.
        </div>

        <button
            class="reload"
            onclick="location.reload()"
        >
            TRY AGAIN
        </button>

    </div>

</div>


<!-- HUD -->

<div id="hud">

    <div class="top">

        <div class="box">

            <div class="title-small">
                SHADOW STRIKE
            </div>

            <div class="hp">
                ◆ HP 100
            </div>

            <div class="energy">
                ⚡ ENERGY 100
            </div>

        </div>


        <div class="map">

            <div class="map-grid"></div>

            <div class="playerDot"></div>

        </div>

    </div>


    <div class="mission">
        OPERATION • NIGHTFALL
    </div>


    <div id="crosshair"></div>


    <button id="exit">
        × EXIT
    </button>


    <div id="joystick">

        <div id="stick"></div>

    </div>


    <button
        class="action"
        id="ability"
    >
        ⚡
    </button>


    <button
        class="action"
        id="shield"
    >
        🛡️
    </button>


    <button
        class="action"
        id="scan"
    >
        📡
    </button>


    <div id="notification">
        SYSTEM READY
    </div>

</div>


<script>

const THREE_CDNS = [

    "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js",

    "https://unpkg.com/three@0.161.0/build/three.min.js"

];

let scene;
let camera;
let renderer;

let clock;

let velocity;

let yaw = 0;
let pitch = 0;

let moveForward = false;
let moveBackward = false;
let moveLeft = false;
let moveRight = false;

let touchLook = null;
let joystickTouch = null;

const worldSize = 1800;


/* ======================================
   LOADING ENGINE
====================================== */

function loadEngine(index = 0){

    if(index >= THREE_CDNS.length){

        showError(
            "Three.js could not be loaded. " +
            "Check your internet connection " +
            "and reload the game."
        );

        return;
    }


    const script =
        document.createElement("script");


    script.src =
        THREE_CDNS[index];


    script.onload = function(){

        if(typeof THREE === "undefined"){

            loadEngine(index + 1);

            return;
        }


        console.log(
            "Three.js loaded successfully."
        );


        startGame();

    };


    script.onerror = function(){

        console.log(
            "CDN failed:",
            THREE_CDNS[index]
        );


        loadEngine(index + 1);

    };


    document.head.appendChild(script);

}


/* ======================================
   ERROR
====================================== */

function showError(message){

    document.getElementById(
        "loading"
    ).style.display = "none";


    document.getElementById(
        "errorScreen"
    ).style.display = "flex";


    document.getElementById(
        "errorText"
    ).textContent = message;

}


/* ======================================
   WEBGL CHECK
====================================== */

function checkWebGL(){

    try{

        const canvas =
            document.createElement("canvas");


        const gl =
            canvas.getContext("webgl2") ||
            canvas.getContext("webgl") ||
            canvas.getContext("experimental-webgl");


        if(!gl){

            return false;
        }


        return true;

    }catch(error){

        return false;

    }

}


/* ======================================
   START GAME
====================================== */

function startGame(){

    if(!checkWebGL()){

        showError(
            "WebGL is not available on this device/browser."
        );

        return;
    }


    try{

        clock =
            new THREE.Clock();


        velocity =
            new THREE.Vector3();


        createScene();

        createCamera();

        createRenderer();

        createLights();

        createTerrain();

        createCity();

        createRoads();

        createProps();

        createSky();

        setupControls();

        window.addEventListener(
            "resize",
            resize
        );


        hideLoading();

        animate();


    }catch(error){

        console.error(error);

        showError(
            "The 3D field could not start."
        );

    }

}


/* ======================================
   SCENE
====================================== */

function createScene(){

    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x07101a
        );


    scene.fog =
        new THREE.Fog(
            0x07101a,
            220,
            1000
        );

}


/* ======================================
   CAMERA
====================================== */

function createCamera(){

    camera =
        new THREE.PerspectiveCamera(
            72,
            innerWidth / innerHeight,
            0.1,
            2000
        );


    camera.position.set(
        0,
        3.2,
        180
    );


    camera.rotation.order =
        "YXZ";

}


/* ======================================
   RENDERER
====================================== */

function createRenderer(){

    renderer =
        new THREE.WebGLRenderer({

            antialias:false,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            1.25
        )
    );


    renderer.setSize(
        innerWidth,
        innerHeight
    );


    renderer.shadowMap.enabled =
        true;


    renderer.shadowMap.type =
        THREE.PCFShadowMap;


    document
        .getElementById("game")
        .appendChild(
            renderer.domElement
        );

}


/* ======================================
   LIGHTS
====================================== */

function createLights(){

    const hemi =
        new THREE.HemisphereLight(
            0x9bc9ff,
            0x172015,
            1.5
        );


    scene.add(hemi);


    const sun =
        new THREE.DirectionalLight(
            0xffffff,
            2
        );


    sun.position.set(
        -250,
        400,
        180
    );


    sun.castShadow = true;


    sun.shadow.mapSize.width =
        1024;

    sun.shadow.mapSize.height =
        1024;


    sun.shadow.camera.left =
        -500;

    sun.shadow.camera.right =
        500;

    sun.shadow.camera.top =
        500;

    sun.shadow.camera.bottom =
        -500;


    scene.add(sun);

}


/* ======================================
   TERRAIN
====================================== */

function createTerrain(){

    const geometry =
        new THREE.PlaneGeometry(
            worldSize,
            worldSize,
            60,
            60
        );


    const material =
        new THREE.MeshStandardMaterial({

            color:
                0x18241b,

            roughness:
                1

        });


    const ground =
        new THREE.Mesh(
            geometry,
            material
        );


    ground.rotation.x =
        -Math.PI / 2;


    ground.receiveShadow =
        true;


    scene.add(ground);


    const grid =
        new THREE.GridHelper(
            worldSize,
            120,
            0x263a32,
            0x15231f
        );


    grid.position.y =
        .02;


    grid.material.transparent =
        true;


    grid.material.opacity =
        .16;


    scene.add(grid);

}


/* ======================================
   BUILDINGS
====================================== */

function createCity(){

    const buildings = [

        [-330,-260,120,80,100],
        [-160,-290,90,100,150],
        [40,-300,130,90,110],
        [240,-260,90,120,170],

        [-390,-70,100,100,130],
        [-220,-80,130,90,90],
        [40,-80,90,100,150],
        [260,-60,130,100,120],

        [-330,120,100,80,170],
        [-120,130,120,110,110],
        [110,120,90,100,160],
        [310,130,120,90,100],

        [-250,310,150,100,130],
        [20,300,100,120,180],
        [260,300,130,90,130]

    ];


    buildings.forEach(
        b => {

            createBuilding(
                b[0],
                b[1],
                b[2],
                b[3],
                b[4]
            );

        }
    );

}


/* ======================================
   SINGLE BUILDING
====================================== */

function createBuilding(
    x,
    z,
    width,
    depth,
    height
){

    const colors = [

        0x27323b,
        0x202b35,
        0x29363e,
        0x222d34

    ];


    const material =
        new THREE.MeshStandardMaterial({

            color:
                colors[
                    Math.floor(
                        Math.random() *
                        colors.length
                    )
                ],

            roughness:
                .86

        });


    const building =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            material

        );


    building.position.set(
        x,
        height / 2,
        z
    );


    building.castShadow =
        true;

    building.receiveShadow =
        true;


    scene.add(building);


    /* ROOF */

    const roof =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width + 5,
                4,
                depth + 5
            ),

            new THREE.MeshStandardMaterial({
                color:0x101820
            })

        );


    roof.position.set(
        x,
        height + 2,
        z
    );


    roof.castShadow =
        true;


    scene.add(roof);


    /* WINDOWS */

    const windowMaterial =
        new THREE.MeshBasicMaterial({

            color:
                0x35d9ff

        });


    for(
        let y = 18;
        y < height - 8;
        y += 22
    ){

        for(
            let xx =
                -width / 2 + 12;

            xx <
                width / 2 - 5;

            xx += 24
        ){

            const window =
                new THREE.Mesh(

                    new THREE.BoxGeometry(
                        8,
                        7,
                        .5
                    ),

                    windowMaterial

                );


            window.position.set(

                x + xx,

                y,

                z - depth / 2 - .3

            );


            scene.add(window);

        }

    }

}


/* ======================================
   ROADS
====================================== */

function createRoads(){

    const material =
        new THREE.MeshStandardMaterial({

            color:
                0x10161b,

            roughness:
                .95

        });


    const roads = [

        [0,0,130,worldSize],

        [0,0,worldSize,130],

        [-350,0,70,worldSize],

        [350,0,70,worldSize],

        [0,-350,worldSize,70],

        [0,350,worldSize,70]

    ];


    roads.forEach(
        r => {

            const road =
                new THREE.Mesh(

                    new THREE.PlaneGeometry(
                        r[2],
                        r[3]
                    ),

                    material

                );


            road.rotation.x =
                -Math.PI / 2;


            road.position.set(
                r[0],
                .05,
                r[1]
            );


            scene.add(road);

        }
    );


    /* ROAD MARKINGS */

    const lineMaterial =
        new THREE.MeshBasicMaterial({

            color:
                0x58645e

        });


    for(
        let x = -850;
        x < 850;
        x += 35
    ){

        const line =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    10,
                    .08,
                    1.5
                ),

                lineMaterial

            );


        line.position.set(
            x,
            .12,
            0
        );


        scene.add(line);

    }

}


/* ======================================
   PROPS
====================================== */

function createProps(){

    for(
        let i = 0;
        i < 100;
        i++
    ){

        const x =
            (Math.random() - .5) *
            1500;


        const z =
            (Math.random() - .5) *
            1500;


        if(
            Math.random() < .5
        ){

            const size =
                4 +
                Math.random() * 5;


            const crate =
                new THREE.Mesh(

                    new THREE.BoxGeometry(
                        size,
                        size,
                        size
                    ),

                    new THREE.MeshStandardMaterial({
                        color:0x514b3b
                    })

                );


            crate.position.set(
                x,
                size / 2,
                z
            );


            crate.castShadow =
                true;


            scene.add(crate);

        }else{

            const height =
                8 +
                Math.random() * 20;


            const pole =
                new THREE.Mesh(

                    new THREE.CylinderGeometry(
                        .7,
                        .9,
                        height,
                        8
                    ),

                    new THREE.MeshStandardMaterial({
                        color:0x252d32
                    })

                );


            pole.position.set(
                x,
                height / 2,
                z
            );


            pole.castShadow =
                true;


            scene.add(pole);

        }

    }

}


/* ======================================
   SKY + MOUNTAINS
====================================== */

function createSky(){

    const moon =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                45,
                24,
                24
            ),

            new THREE.MeshBasicMaterial({

                color:
                    0x9dc8e6

            })

        );


    moon.position.set(
        -500,
        500,
        -700
    );


    scene.add(moon);


    for(
        let i = 0;
        i < 24;
        i++
    ){

        const height =
            60 +
            Math.random() *
            180;


        const mountain =
            new THREE.Mesh(

                new THREE.ConeGeometry(
                    80 +
                    Math.random() *
                    80,

                    height,

                    5
                ),

                new THREE.MeshStandardMaterial({

                    color:
                        0x111b1c,

                    roughness:
                        1

                })

            );


        const angle =
            i / 24 *
            Math.PI *
            2;


        const radius =
            700;


        mountain.position.set(

            Math.cos(angle) *
            radius,

            height / 2,

            Math.sin(angle) *
            radius

        );


        scene.add(mountain);

    }

}


/* ======================================
   CONTROLS
====================================== */

function setupControls(){

    const joystick =
        document.getElementById(
            "joystick"
        );


    const stick =
        document.getElementById(
            "stick"
        );


    joystick.addEventListener(
        "touchstart",
        function(e){

            e.preventDefault();

            joystickTouch =
                e.changedTouches[0]
                .identifier;

        },
        {
            passive:false
        }
    );


    joystick.addEventListener(
        "touchmove",
        function(e){

            e.preventDefault();


            for(
                const touch of
                e.changedTouches
            ){

                if(
                    touch.identifier !==
                    joystickTouch
                ){
                    continue;
                }


                const rect =
                    joystick
                    .getBoundingClientRect();


                let dx =
                    touch.clientX -
                    (
                        rect.left +
                        rect.width / 2
                    );


                let dy =
                    touch.clientY -
                    (
                        rect.top +
                        rect.height / 2
                    );


                const max =
                    38;


                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                if(
                    distance > max
                ){

                    dx =
                        dx /
                        distance *
                        max;


                    dy =
                        dy /
                        distance *
                        max;

                }


                stick.style.left =
                    `calc(50% + ${dx}px)`;


                stick.style.top =
                    `calc(50% + ${dy}px)`;


                moveForward =
                    dy < -10;


                moveBackward =
                    dy > 10;


                moveLeft =
                    dx < -10;


                moveRight =
                    dx > 10;

            }

        },
        {
            passive:false
        }
    );


    joystick.addEventListener(
        "touchend",
        function(e){

            e.preventDefault();

            resetJoystick();

        },
        {
            passive:false
        }
    );


    joystick.addEventListener(
        "touchcancel",
        function(){

            resetJoystick();

        }
    );


    /* LOOK */

    document.addEventListener(
        "touchstart",
        function(e){

            if(
                e.target.closest(
                    "#joystick"
                ) ||

                e.target.closest(
                    ".action"
                ) ||

                e.target.id ===
                "exit"
            ){
                return;
            }


            const t =
                e.changedTouches[0];


            touchLook = {

                id:
                    t.identifier,

                x:
                    t.clientX,

                y:
                    t.clientY

            };

        }
    );


    document.addEventListener(
        "touchmove",
        function(e){

            if(!touchLook){
                return;
            }


            for(
                const t of
                e.changedTouches
            ){

                if(
                    t.identifier !==
                    touchLook.id
                ){
                    continue;
                }


                const dx =
                    t.clientX -
                    touchLook.x;


                const dy =
                    t.clientY -
                    touchLook.y;


                yaw -=
                    dx * .004;


                pitch -=
                    dy * .003;


                pitch =
                    Math.max(
                        -1.35,
                        Math.min(
                            1.35,
                            pitch
                        )
                    );


                touchLook.x =
                    t.clientX;


                touchLook.y =
                    t.clientY;

            }

        }
    );


    document.addEventListener(
        "touchend",
        function(e){

            for(
                const t of
                e.changedTouches
            ){

                if(
                    touchLook &&
                    t.identifier ===
                    touchLook.id
                ){

                    touchLook =
                        null;

                }

            }

        }
    );


    /* EXIT */

    document
        .getElementById("exit")
        .onclick = function(){

            location.href =
                "index.html";

        };


    /* ABILITY */

    document
        .getElementById("ability")
        .onclick = function(){

            flash(
                "ENERGY PULSE READY"
            );

        };


    /* SHIELD */

    document
        .getElementById("shield")
        .onclick = function(){

            flash(
                "SHIELD ACTIVE"
            );

        };


    /* SCANNER */

    document
        .getElementById("scan")
        .onclick = function(){

            flash(
                "SCANNER ACTIVE"
            );

        };

}


/* ======================================
   RESET JOYSTICK
====================================== */

function resetJoystick(){

    joystickTouch =
        null;


    const stick =
        document.getElementById(
            "stick"
        );


    stick.style.left =
        "50%";


    stick.style.top =
        "50%";


    moveForward =
        false;

    moveBackward =
        false;

    moveLeft =
        false;

    moveRight =
        false;

}


/* ======================================
   EFFECT
====================================== */

function flash(text){

    const notification =
        document.getElementById(
            "notification"
        );


    notification.textContent =
        text;


    notification.classList.add(
        "show"
    );


    const crosshair =
        document.getElementById(
            "crosshair"
        );


    crosshair.style.transform =
        "translate(-50%,-50%) scale(1.8)";


    setTimeout(
        function(){

            notification
                .classList
                .remove("show");


            crosshair.style.transform =
                "translate(-50%,-50%) scale(1)";

        },
        700
    );

}


/* ======================================
   UPDATE
====================================== */

function update(){

    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    const speed =
        75 * delta;


    if(moveForward){

        velocity.z -=
            speed;

    }


    if(moveBackward){

        velocity.z +=
            speed;

    }


    if(moveLeft){

        velocity.x -=
            speed;

    }


    if(moveRight){

        velocity.x +=
            speed;

    }


    velocity.multiplyScalar(
        .82
    );


    const forward =
        new THREE.Vector3(

            Math.sin(yaw),

            0,

            Math.cos(yaw)

        );


    const right =
        new THREE.Vector3(

            Math.cos(yaw),

            0,

            -Math.sin(yaw)

        );


    camera.position
        .addScaledVector(
            forward,
            -velocity.z
        );


    camera.position
        .addScaledVector(
            right,
            velocity.x
        );


    camera.position.x =
        THREE.MathUtils.clamp(

            camera.position.x,

            -worldSize / 2 + 15,

            worldSize / 2 - 15

        );


    camera.position.z =
        THREE.MathUtils.clamp(

            camera.position.z,

            -worldSize / 2 + 15,

            worldSize / 2 - 15

        );


    camera.position.y =
        3.2;


    camera.rotation.y =
        yaw;


    camera.rotation.x =
        pitch;

}


/* ======================================
   GAME LOOP
====================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    update();


    renderer.render(
        scene,
        camera
    );

}


/* ======================================
   RESIZE
====================================== */

function resize(){

    if(
        !camera ||
        !renderer
    ){
        return;
    }


    camera.aspect =
        innerWidth /
        innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        innerWidth,
        innerHeight
    );

}


/* ======================================
   HIDE LOADING
====================================== */

function hideLoading(){

    const loading =
        document.getElementById(
            "loading"
        );


    loading.style.opacity =
        "0";


    setTimeout(
        function(){

            loading.style.display =
                "none";

        },
        400
    );

}


/* ======================================
   START
====================================== */

loadEngine();

</script>
