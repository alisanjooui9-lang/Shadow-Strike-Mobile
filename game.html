<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shadow Strike - Game</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,sans-serif;
    background:#080d13;
    color:#ffffff;
    overflow-x:hidden;
}

/* BACKGROUND */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-2;
    background:
        radial-gradient(
            circle at 50% 0%,
            #16415a 0%,
            #0b1721 35%,
            #05080c 80%
        );
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    background:
        linear-gradient(
            rgba(255,255,255,.02) 1px,
            transparent 1px
        );
    background-size:100% 4px;
}

/* TOP BAR */

.top{
    height:65px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 12px;
    background:#090f16;
    border-bottom:1px solid #294050;
}

.back{
    border:1px solid #3a5263;
    border-radius:10px;
    padding:10px 12px;
    background:#111d27;
    color:white;
    font-weight:bold;
    font-size:12px;
}

.title{
    text-align:center;
}

.title strong{
    display:block;
    font-size:14px;
    letter-spacing:2px;
}

.title span{
    display:block;
    margin-top:3px;
    color:#55d5ff;
    font-size:9px;
    letter-spacing:1px;
}

.stats{
    display:flex;
    gap:5px;
}

.stat{
    background:#111d27;
    border:1px solid #294050;
    border-radius:8px;
    padding:7px 8px;
    font-size:11px;
}

/* MAIN */

main{
    width:100%;
    min-height:calc(100vh - 65px);
    padding:18px 14px 40px;
}

/* MISSION CARD */

.mission{
    width:100%;
    max-width:650px;
    margin:0 auto;
    padding:20px;
    background:#101a23;
    border:1px solid #304858;
    border-radius:18px;
    box-shadow:0 15px 40px rgba(0,0,0,.45);
}

.label{
    color:#55d5ff;
    font-size:10px;
    font-weight:bold;
    letter-spacing:3px;
}

h1{
    margin-top:9px;
    font-size:27px;
}

.description{
    margin-top:9px;
    color:#aebbc6;
    font-size:13px;
    line-height:1.6;
}

/* PROGRESS */

.progress-info{
    display:flex;
    justify-content:space-between;
    margin-top:22px;
    margin-bottom:8px;
    color:#b8c5ce;
    font-size:10px;
    font-weight:bold;
}

.progress{
    width:100%;
    height:10px;
    background:#05090d;
    border-radius:20px;
    border:1px solid #263844;
    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#20c5ff;
    transition:.3s;
}

/* OBJECTIVE */

.objective{
    margin-top:18px;
    padding:15px;
    background:#0a1118;
    border:1px solid #2a3f4d;
    border-radius:13px;
}

.objective-title{
    margin-bottom:10px;
    font-size:12px;
    font-weight:bold;
}

.target{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px;
    background:#121e28;
    border-radius:9px;
}

.target-name{
    color:#b9c6cf;
    font-size:12px;
}

.target-count{
    color:#55d5ff;
    font-size:12px;
    font-weight:bold;
}

/* BUTTONS */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:18px;
}

button{
    font-family:Arial,sans-serif;
    cursor:pointer;
}

.complete{
    border:0;
    border-radius:11px;
    padding:14px 8px;
    background:#168fff;
    color:white;
    font-weight:bold;
    font-size:12px;
}

.reset{
    border:1px solid #3a5263;
    border-radius:11px;
    padding:14px 8px;
    background:#111d27;
    color:white;
    font-weight:bold;
    font-size:12px;
}

/* LEVEL TITLE */

.level-title{
    width:100%;
    max-width:650px;
    margin:25px auto 10px;
    font-size:16px;
}

/* LEVELS */

.levels{
    width:100%;
    max-width:650px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
}

.level{
    min-height:65px;
    padding:10px 3px;
    text-align:center;
    background:#101a23;
    border:1px solid #2c414e;
    border-radius:11px;
    color:#b9c6cf;
    font-size:9px;
}

.level b{
    display:block;
    margin-bottom:5px;
    color:#ffffff;
    font-size:17px;
}

.level.current{
    border-color:#20c5ff;
    box-shadow:0 0 12px rgba(32,197,255,.15);
}

.level.locked{
    opacity:.45;
}

/* TOAST */

#toast{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%);
    display:none;
    z-index:100;
    padding:11px 18px;
    background:#111d27;
    border:1px solid #3a5263;
    border-radius:10px;
    color:white;
    font-size:12px;
    white-space:nowrap;
}

/* MOBILE */

@media(max-width:500px){

    .title strong{
        font-size:11px;
    }

    .title span{
        font-size:8px;
    }

    .stats .stat{
        padding:6px;
        font-size:9px;
    }

    .mission{
        padding:17px;
    }

    h1{
        font-size:23px;
    }

    .description{
        font-size:12px;
    }

    .levels{
        grid-template-columns:repeat(5,1fr);
    }

}
</style>
</head>

<body>

<header class="top">

    <button class="back" onclick="goHome()">
        ← HOME
    </button>

    <div class="title">
        <strong>SHADOW STRIKE</strong>
        <span>MISSION CONTROL</span>
    </div>

    <div class="stats">

        <div class="stat">
            🪙 <span id="credits">1000</span>
        </div>

        <div class="stat">
            ⭐ <span id="xp">0</span>
        </div>

    </div>

</header>


<main>

<section class="mission">

    <div class="label">
        ACTIVE OPERATION
    </div>

    <h1 id="missionName">
        TRAINING PROTOCOL
    </h1>

    <p id="description" class="description">
        Complete the objective to advance to the next mission.
    </p>


    <div class="progress-info">

        <span>
            MISSION PROGRESS
        </span>

        <span id="progressText">
            0 / 5
        </span>

    </div>


    <div class="progress">

        <div
            id="progressBar"
            class="progress-bar">
        </div>

    </div>


    <div class="objective">

        <div class="objective-title">
            🎯 CURRENT OBJECTIVE
        </div>

        <div class="target">

            <span
                id="targetName"
                class="target-name">
                Training Tasks
            </span>

            <span
                id="targetCount"
                class="target-count">
                0 / 5
            </span>

        </div>

    </div>


    <div class="actions">

        <button
            class="complete"
            onclick="completeTask()">
            ✓ COMPLETE TASK
        </button>

        <button
            class="reset"
            onclick="resetMission()">
            ↻ RESET
        </button>

    </div>

</section>


<h2 class="level-title">
    MISSION LEVELS
</h2>


<section
    id="levels"
    class="levels">
</section>

</main>


<div id="toast"></div>


<script>

const missions = [

    {
        name:"TRAINING PROTOCOL",
        description:"Complete your first training operation.",
        target:"Training Tasks",
        goal:5,
        credits:100,
        xp:50
    },

    {
        name:"SHADOW RECON",
        description:"Complete reconnaissance objectives.",
        target:"Recon Tasks",
        goal:7,
        credits:150,
        xp:75
    },

    {
        name:"NIGHT OPERATION",
        description:"Complete the night operation.",
        target:"Night Tasks",
        goal:10,
        credits:200,
        xp:100
    },

    {
        name:"ELITE PROTOCOL",
        description:"Complete advanced operator training.",
        target:"Elite Tasks",
        goal:12,
        credits:300,
        xp:150
    },

    {
        name:"FINAL PROTOCOL",
        description:"Complete the final protocol.",
        target:"Final Tasks",
        goal:15,
        credits:500,
        xp:250
    }

];


/* LOAD DATA */

const defaultData = {
    playerName:"GHOST",
    level:1,
    sc:250,
    credits:1000,
    selectedMode:"Easy",
    unlockedLevel:1,
    missionProgress:0,
    xp:0
};

let data = defaultData;

try{

    const saved =
        localStorage.getItem("shadowStrike");

    if(saved){

        const parsed =
            JSON.parse(saved);

        data = {
            ...defaultData,
            ...parsed
        };

    }

}catch(error){

    data = {
        ...defaultData
    };

}


/* SAVE */

function save(){

    try{

        localStorage.setItem(
            "shadowStrike",
            JSON.stringify(data)
        );

    }catch(error){

        console.log(error);

    }

}


/* CURRENT MISSION */

function currentMission(){

    let index =
        Number(data.level) - 1;

    if(index < 0){
        index = 0;
    }

    if(index >= missions.length){
        index = missions.length - 1;
    }

    return missions[index];

}


/* RENDER */

function render(){

    const mission =
        currentMission();

    document.getElementById(
        "missionName"
    ).textContent =
        mission.name;

    document.getElementById(
        "description"
    ).textContent =
        mission.description;

    document.getElementById(
        "targetName"
    ).textContent =
        mission.target;

    document.getElementById(
        "credits"
    ).textContent =
        data.credits;

    document.getElementById(
        "xp"
    ).textContent =
        data.xp;


    let progress =
        Number(data.missionProgress) || 0;

    if(progress > mission.goal){
        progress = mission.goal;
    }


    document.getElementById(
        "progressText"
    ).textContent =
        progress + " / " + mission.goal;

    document.getElementById(
        "targetCount"
    ).textContent =
        progress + " / " + mission.goal;


    const percentage =
        (progress / mission.goal) * 100;

    document.getElementById(
        "progressBar"
    ).style.width =
        percentage + "%";


    renderLevels();

}


/* LEVELS */

function renderLevels(){

    const box =
        document.getElementById("levels");

    box.innerHTML = "";


    missions.forEach(
        function(mission,index){

            const number =
                index + 1;

            const div =
                document.createElement("div");

            div.className = "level";


            if(number === Number(data.level)){
                div.classList.add("current");
            }

            if(number > Number(data.unlockedLevel)){
                div.classList.add("locked");
            }


            const icon =
                number <= Number(data.unlockedLevel)
                ? "✓"
                : "🔒";


            div.innerHTML =
                "<b>" +
                icon +
                "</b>" +
                "LEVEL " +
                number;


            box.appendChild(div);

        }
    );

}


/* COMPLETE TASK */

function completeTask(){

    const mission =
        currentMission();


    if(
        Number(data.missionProgress)
        >= mission.goal
    ){
        return;
    }


    data.missionProgress =
        Number(data.missionProgress) + 1;


    if(
        data.missionProgress >=
        mission.goal
    ){

        finishMission();
        return;

    }


    save();

    render();

    showToast(
        "TASK COMPLETED"
    );

}


/* FINISH MISSION */

function finishMission(){

    const mission =
        currentMission();


    data.credits =
        Number(data.credits) +
        mission.credits;

    data.xp =
        Number(data.xp) +
        mission.xp;


    if(
        Number(data.level) <
        missions.length
    ){

        data.level =
            Number(data.level) + 1;

        data.unlockedLevel =
            Math.max(
                Number(data.unlockedLevel),
                Number(data.level)
            );

        data.missionProgress = 0;

    }


    save();

    render();

    showToast(
        "MISSION COMPLETE! +" +
        mission.xp +
        " XP"
    );

}


/* RESET */

function resetMission(){

    data.missionProgress = 0;

    save();

    render();

    showToast(
        "MISSION RESET"
    );

}


/* HOME */

function goHome(){

    window.location.href =
        "index.html";

}


/* TOAST */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.style.display =
        "block";


    setTimeout(
        function(){

            toast.style.display =
                "none";

        },
        1600
    );

}


/* START */

render();

</script>

</body>
</html>
