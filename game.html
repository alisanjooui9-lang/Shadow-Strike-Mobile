<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Shadow Strike | Mission</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#05070b;
    color:white;
    min-height:100vh;
    overflow:hidden;
}

.background{
    position:fixed;
    inset:0;
    z-index:-2;
    background:
        radial-gradient(circle at 80% 20%,rgba(0,180,255,.20),transparent 28%),
        radial-gradient(circle at 15% 80%,rgba(130,0,255,.18),transparent 30%),
        linear-gradient(135deg,#030509,#0a111b,#020306);
}

.top{
    height:65px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 15px;
    background:rgba(4,7,12,.9);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.back{
    border:0;
    background:rgba(255,255,255,.06);
    color:white;
    padding:9px 13px;
    border-radius:10px;
    cursor:pointer;
}

.title{
    text-align:center;
}

.title b{
    display:block;
    font-size:14px;
    letter-spacing:2px;
}

.title small{
    color:#687789;
    font-size:9px;
}

.stats{
    display:flex;
    gap:7px;
}

.stat{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    padding:7px 9px;
    border-radius:9px;
    font-size:11px;
}

.main{
    height:calc(100vh - 65px);
    overflow-y:auto;
    padding:18px 15px 30px;
    max-width:700px;
    margin:auto;
}

.mission{
    padding:22px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.045);
    box-shadow:0 15px 40px rgba(0,0,0,.45);
}

.mission-label{
    color:#55cfff;
    font-size:10px;
    letter-spacing:3px;
    font-weight:bold;
}

.mission h1{
    margin:8px 0 6px;
    font-size:30px;
}

.description{
    color:#91a0b2;
    font-size:12px;
    line-height:1.6;
}

.progress-box{
    margin-top:20px;
}

.progress-info{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    margin-bottom:7px;
}

.progress{
    width:100%;
    height:9px;
    background:#111923;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#19bfff,#176dff);
    transition:.3s;
}

.objective{
    margin-top:18px;
    padding:16px;
    border-radius:15px;
    background:rgba(0,0,0,.25);
    border:1px solid rgba(255,255,255,.07);
}

.objective h2{
    font-size:14px;
    margin-bottom:12px;
}

.target{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:13px;
    border-radius:11px;
    background:rgba(255,255,255,.045);
}

.target-name{
    font-size:12px;
    color:#b6c1ce;
}

.target-count{
    font-size:15px;
    font-weight:bold;
    color:#65d8ff;
}

.action{
    margin-top:18px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.action button{
    border:0;
    border-radius:12px;
    padding:14px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.complete-btn{
    background:linear-gradient(135deg,#19bfff,#176dff);
}

.reset-btn{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1)!important;
}

.levels-title{
    margin:22px 2px 10px;
    font-size:15px;
}

.levels{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.level-card{
    min-height:70px;
    padding:10px 5px;
    border-radius:12px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
    text-align:center;
    font-size:11px;
}

.level-card b{
    display:block;
    font-size:16px;
    margin-bottom:6px;
}

.level-card small{
    color:#647386;
}

.level-card.current{
    border-color:#29c5ff;
    box-shadow:0 0 15px rgba(0,190,255,.15);
}

.level-card.unlocked{
    color:#65e68c;
}

.level-card.locked{
    opacity:.45;
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(20px);
    padding:11px 18px;
    border-radius:10px;
    background:#111923;
    border:1px solid rgba(255,255,255,.1);
    opacity:0;
    pointer-events:none;
    transition:.3s;
    font-size:12px;
    white-space:nowrap;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:380px;
    padding:25px;
    border-radius:20px;
    background:#0b121b;
    border:1px solid rgba(255,255,255,.1);
    text-align:center;
}

.modal-box h2{
    color:#65e68c;
    margin-bottom:10px;
}

.reward{
    margin:15px 0;
    padding:13px;
    border-radius:12px;
    background:rgba(255,255,255,.05);
    color:#ffd45c;
}

.modal-box button{
    width:100%;
    border:0;
    padding:13px;
    border-radius:11px;
    background:linear-gradient(135deg,#19bfff,#176dff);
    color:white;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="background"></div>

<header class="top">

    <button class="back" onclick="goHome()">
        ← HOME
    </button>

    <div class="title">
        <b>SHADOW STRIKE</b>
        <small>MISSION CONTROL</small>
    </div>

    <div class="stats">
        <div class="stat">
            🪙 <span id="credits">1000</span>
        </div>
        <div class="stat">
            ⭐ <span id="xp">0</span>
        </div>
    </div>

</header>


<main class="main">

    <section class="mission">

        <div class="mission-label">
            ACTIVE OPERATION
        </div>

        <h1 id="missionName">
            TRAINING PROTOCOL
        </h1>

        <p class="description" id="description">
            Complete the objective to advance to the next mission.
        </p>


        <div class="progress-box">

            <div class="progress-info">
                <span>MISSION PROGRESS</span>
                <span id="progressText">0 / 5</span>
            </div>

            <div class="progress">
                <div
                    class="progress-bar"
                    id="progressBar">
                </div>
            </div>

        </div>


        <div class="objective">

            <h2>🎯 CURRENT OBJECTIVE</h2>

            <div class="target">

                <span
                    class="target-name"
                    id="targetName">
                    Complete Training Tasks
                </span>

                <span
                    class="target-count"
                    id="targetCount">
                    0 / 5
                </span>

            </div>

        </div>


        <div class="action">

            <button
                class="complete-btn"
                onclick="completeTask()">
                ✓ COMPLETE TASK
            </button>

            <button
                class="reset-btn"
                onclick="resetMission()">
                ↻ RESET
            </button>

        </div>

    </section>


    <h2 class="levels-title">
        MISSION LEVELS
    </h2>

    <section class="levels" id="levels"></section>

</main>


<div class="toast" id="toast"></div>


<div class="modal" id="rewardModal">

    <div class="modal-box">

        <h2>MISSION COMPLETE</h2>

        <p>
            Operation completed successfully.
        </p>

        <div class="reward">
            🪙 +<span id="rewardCredits">100</span>
            &nbsp;&nbsp;
            ⭐ +<span id="rewardXP">50</span>
        </div>

        <button onclick="nextLevel()">
            CONTINUE →
        </button>

    </div>

</div>


<script>

const missions = [

    {
        name:"TRAINING PROTOCOL",
        description:"Complete your first training operation.",
        target:"Complete Training Tasks",
        goal:5,
        rewardCredits:100,
        rewardXP:50
    },

    {
        name:"SHADOW RECON",
        description:"Complete reconnaissance objectives.",
        target:"Recon Tasks",
        goal:7,
        rewardCredits:150,
        rewardXP:75
    },

    {
        name:"NIGHT OPERATION",
        description:"Complete the night-operation objectives.",
        target:"Night Tasks",
        goal:10,
        rewardCredits:200,
        rewardXP:100
    },

    {
        name:"ELITE PROTOCOL",
        description:"Complete advanced operator training.",
        target:"Elite Tasks",
        goal:12,
        rewardCredits:300,
        rewardXP:150
    },

    {
        name:"FINAL PROTOCOL",
        description:"Complete the final training protocol.",
        target:"Final Tasks",
        goal:15,
        rewardCredits:500,
        rewardXP:250
    }

];


const defaultGameData = {

    playerName:"GHOST",
    level:1,
    sc:250,
    credits:1000,
    selectedMode:"Easy",
    unlockedLevel:1,

    missionProgress:0,
    xp:0

};


let data;

try{

    data =
        JSON.parse(
            localStorage.getItem("shadowStrike")
        ) || defaultGameData;

}catch(error){

    data = defaultGameData;

}


/* اگر اطلاعات قدیمی بود */

if(typeof data.unlockedLevel !== "number"){
    data.unlockedLevel = 1;
}

if(typeof data.missionProgress !== "number"){
    data.missionProgress = 0;
}

if(typeof data.xp !== "number"){
    data.xp = 0;
}


/* ذخیره */

function saveData(){

    localStorage.setItem(
        "shadowStrike",
        JSON.stringify(data)
    );

}


/* مأموریت فعلی */

function getMission(){

    const index =
        Math.min(
            data.level - 1,
            missions.length - 1
        );

    return missions[index];

}


/* نمایش */

function render(){

    const mission = getMission();

    document.getElementById("missionName")
        .textContent = mission.name;

    document.getElementById("description")
        .textContent = mission.description;

    document.getElementById("targetName")
        .textContent = mission.target;

    document.getElementById("credits")
        .textContent = data.credits;

    document.getElementById("xp")
        .textContent = data.xp;

    const progress =
        Math.min(
            data.missionProgress,
            mission.goal
        );

    document.getElementById("targetCount")
        .textContent =
        progress + " / " + mission.goal;

    document.getElementById("progressText")
        .textContent =
        progress + " / " + mission.goal;

    const percentage =
        (progress / mission.goal) * 100;

    document.getElementById("progressBar")
        .style.width =
        percentage + "%";


    renderLevels();

}


function renderLevels(){

    const container =
        document.getElementById("levels");

    container.innerHTML = "";

    missions.forEach((mission,index)=>{

        const levelNumber = index + 1;

        const card =
            document.createElement("div");

        card.className = "level-card";


        if(levelNumber === data.level){
            card.classList.add("current");
        }

        if(levelNumber <= data.unlockedLevel){
            card.classList.add("unlocked");
        }

        if(levelNumber > data.unlockedLevel){
            card.classList.add("locked");
        }


        card.innerHTML = `
            <b>
                ${
                    levelNumber <= data.unlockedLevel
                    ? "✓"
                    : "🔒"
                }
            </b>

            LEVEL ${levelNumber}

            <small>
                ${levelNumber === data.level
                    ? "CURRENT"
                    : levelNumber <= data.unlockedLevel
                    ? "UNLOCKED"
                    : "LOCKED"}
            </small>
        `;


        container.appendChild(card);

    });

}


/* انجام یک کار */

function completeTask(){

    const mission = getMission();

    if(data.missionProgress >= mission.goal){

        showToast("Mission already completed");

        return;
    }


    data.missionProgress++;

    saveData();

    render();


    if(data.missionProgress >= mission.goal){

        completeMission();

    }else{

        showToast(
            "Objective progress: " +
            data.missionProgress +
            "/" +
            mission.goal
        );

    }

}


/* تکمیل مرحله */

function completeMission(){

    const mission = getMission();

    data.credits += mission.rewardCredits;

    data.xp += mission.rewardXP;


    if(
        data.level < missions.length
    ){

        data.unlockedLevel =
            Math.max(
                data.unlockedLevel,
                data.level + 1
            );

    }


    saveData();


    document.getElementById("rewardCredits")
        .textContent =
        mission.rewardCredits;

    document.getElementById("rewardXP")
        .textContent =
        mission.rewardXP;

    document.getElementById("rewardModal")
        .classList.add("show");

}


/* مرحله بعد */

function nextLevel(){

    document.getElementById("rewardModal")
        .classList.remove("show");


    if(data.level < missions.length){

        data.level++;

        data.missionProgress = 0;

        saveData();

        render();

        showToast(
            "LEVEL " +
            data.level +
            " UNLOCKED!"
        );

    }else{

        showToast(
            "ALL MISSIONS COMPLETED!"
        );

    }

}


/* ریست مرحله */

function resetMission(){

    data.missionProgress = 0;

    saveData();

    render();

    showToast("Mission reset");

}


/* خانه */

function goHome(){

    window.location.href =
        "index.html";

}


/* Toast */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(()=>{

        toast.classList.remove("show");

    },1800);

}


render();

</script>

</body>
</html>
