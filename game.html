<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shadow Strike - Game</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
}

body{
    font-family:Arial,sans-serif;
    background:#070b10;
    color:white;
    overflow:hidden;
}

/* BACKGROUND */

.game-bg{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 50% 20%, #12324a 0%, transparent 35%),
        linear-gradient(135deg,#05070a,#0c141d);
    z-index:-1;
}

/* TOP */

.top{
    height:65px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 14px;
    background:rgba(0,0,0,.75);
    border-bottom:1px solid #263442;
}

.back{
    padding:10px 14px;
    border:1px solid #34495a;
    border-radius:10px;
    background:#111a23;
    color:white;
    font-weight:bold;
}

.title{
    text-align:center;
}

.title strong{
    display:block;
    font-size:14px;
    letter-spacing:2px;
}

.title span{
    font-size:9px;
    color:#55cfff;
}

/* STATS */

.stats{
    display:flex;
    gap:6px;
}

.stat{
    background:#101820;
    border:1px solid #263442;
    border-radius:8px;
    padding:7px 9px;
    font-size:11px;
}

/* MAIN */

main{
    height:calc(100vh - 65px);
    overflow-y:auto;
    padding:18px;
}

/* MISSION */

.mission{
    max-width:650px;
    margin:auto;
    background:#101820;
    border:1px solid #263442;
    border-radius:18px;
    padding:22px;
    box-shadow:0 10px 35px rgba(0,0,0,.5);
}

.label{
    color:#55cfff;
    font-size:11px;
    letter-spacing:3px;
    font-weight:bold;
}

h1{
    margin-top:8px;
    font-size:29px;
}

.description{
    color:#a6b3c1;
    margin-top:8px;
    line-height:1.6;
    font-size:13px;
}

/* PROGRESS */

.progress-info{
    display:flex;
    justify-content:space-between;
    margin-top:22px;
    margin-bottom:8px;
    font-size:11px;
}

.progress{
    height:10px;
    background:#05080c;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#18bfff;
    transition:.3s;
}

/* OBJECTIVE */

.objective{
    margin-top:18px;
    padding:16px;
    border-radius:13px;
    background:#0b1117;
    border:1px solid #263442;
}

.objective-title{
    font-weight:bold;
    font-size:13px;
    margin-bottom:12px;
}

.target{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#121c25;
    padding:13px;
    border-radius:10px;
}

.target-name{
    color:#b9c5d0;
    font-size:12px;
}

.target-count{
    color:#55cfff;
    font-weight:bold;
}

/* BUTTONS */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:18px;
}

button{
    cursor:pointer;
}

.complete{
    border:0;
    border-radius:11px;
    padding:14px;
    background:#168cff;
    color:white;
    font-weight:bold;
}

.reset{
    border:1px solid #34495a;
    border-radius:11px;
    padding:14px;
    background:#111a23;
    color:white;
    font-weight:bold;
}

/* LEVELS */

.level-title{
    max-width:650px;
    margin:22px auto 10px;
    font-size:16px;
}

.levels{
    max-width:650px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.level{
    padding:12px 4px;
    text-align:center;
    background:#101820;
    border:1px solid #263442;
    border-radius:11px;
    font-size:10px;
}

.level b{
    display:block;
    font-size:18px;
    margin-bottom:5px;
}

.level.current{
    border-color:#18bfff;
}

.level.locked{
    opacity:.4;
}

/* TOAST */

#toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    background:#111b24;
    border:1px solid #34495a;
    padding:11px 18px;
    border-radius:10px;
    font-size:12px;
    display:none;
}

/* MOBILE */

@media(max-width:500px){

    .stats .stat{
        padding:6px;
        font-size:10px;
    }

    .title strong{
        font-size:11px;
    }

    .mission{
        padding:18px;
    }

    h1{
        font-size:24px;
    }

    .levels{
        grid-template-columns:repeat(5,1fr);
    }

}
</style>
</head>

<body>

<div class="game-bg"></div>

<header class="top">

    <button class="back" onclick="goHome()">
        ← HOME
    </button>

    <div class="title">
        <strong>SHADOW STRIKE</strong>
        <span>MISSION CONTROL</span>
    </div>

    <div class="stats">
        <div class="stat">
            🪙 <span id="credits">1000</span>
        </div>

        <div class="stat">
            ⭐ <span id="xp">0</span>
        </div>
    </div>

</header>


<main>

<section class="mission">

    <div class="label">
        ACTIVE OPERATION
    </div>

    <h1 id="missionName">
        TRAINING PROTOCOL
    </h1>

    <p class="description" id="description">
        Complete the objective to advance to the next mission.
    </p>


    <div class="progress-info">
        <span>MISSION PROGRESS</span>

        <span id="progressText">
            0 / 5
        </span>
    </div>

    <div class="progress">
        <div
            id="progressBar"
            class="progress-bar">
        </div>
    </div>


    <div class="objective">

        <div class="objective-title">
            🎯 CURRENT OBJECTIVE
        </div>

        <div class="target">

            <span
                id="targetName"
                class="target-name">
                Training Tasks
            </span>

            <span
                id="targetCount"
                class="target-count">
                0 / 5
            </span>

        </div>

    </div>


    <div class="actions">

        <button
            class="complete"
            onclick="completeTask()">

            ✓ COMPLETE TASK

        </button>

        <button
            class="reset"
            onclick="resetMission()">

            ↻ RESET

        </button>

    </div>

</section>


<h2 class="level-title">
    MISSION LEVELS
</h2>


<section
    id="levels"
    class="levels">
</section>

</main>


<div id="toast"></div>


<script>

const missions = [

    {
        name:"TRAINING PROTOCOL",
        description:"Complete your first training operation.",
        target:"Training Tasks",
        goal:5,
        credits:100,
        xp:50
    },

    {
        name:"SHADOW RECON",
        description:"Complete reconnaissance objectives.",
        target:"Recon Tasks",
        goal:7,
        credits:150,
        xp:75
    },

    {
        name:"NIGHT OPERATION",
        description:"Complete the night operation.",
        target:"Night Tasks",
        goal:10,
        credits:200,
        xp:100
    },

    {
        name:"ELITE PROTOCOL",
        description:"Complete advanced operator training.",
        target:"Elite Tasks",
        goal:12,
        credits:300,
        xp:150
    },

    {
        name:"FINAL PROTOCOL",
        description:"Complete the final protocol.",
        target:"Final Tasks",
        goal:15,
        credits:500,
        xp:250
    }

];


/* DATA */

const defaultData = {

    playerName:"GHOST",

    level:1,

    sc:250,

    credits:1000,

    selectedMode:"Easy",

    unlockedLevel:1,

    missionProgress:0,

    xp:0

};


let data;

try{

    data =
        JSON.parse(
            localStorage.getItem("shadowStrike")
        ) || defaultData;

}catch(e){

    data = defaultData;

}


/* FIX OLD DATA */

if(!data.level){
    data.level = 1;
}

if(!data.unlockedLevel){
    data.unlockedLevel = 1;
}

if(typeof data.missionProgress !== "number"){
    data.missionProgress = 0;
}

if(typeof data.xp !== "number"){
    data.xp = 0;
}

if(typeof data.credits !== "number"){
    data.credits = 1000;
}


/* SAVE */

function save(){

    localStorage.setItem(
        "shadowStrike",
        JSON.stringify(data)
    );

}


/* CURRENT MISSION */

function currentMission(){

    return missions[
        Math.min(
            data.level - 1,
            missions.length - 1
        )
    ];

}


/* RENDER */

function render(){

    const mission =
        currentMission();

    document.getElementById(
        "missionName"
    ).textContent =
        mission.name;

    document.getElementById(
        "description"
    ).textContent =
        mission.description;

    document.getElementById(
        "targetName"
    ).textContent =
        mission.target;

    document.getElementById(
        "credits"
    ).textContent =
        data.credits;

    document.getElementById(
        "xp"
    ).textContent =
        data.xp;


    let progress =
        Math.min(
            data.missionProgress,
            mission.goal
        );


    document.getElementById(
        "progressText"
    ).textContent =
        progress + " / " + mission.goal;


    document.getElementById(
        "targetCount"
    ).textContent =
        progress + " / " + mission.goal;


    document.getElementById(
        "progressBar"
    ).style.width =
        ((progress / mission.goal) * 100) + "%";


    renderLevels();

}


/* LEVELS */

function renderLevels(){

    const box =
        document.getElementById("levels");

    box.innerHTML = "";


    missions.forEach(
        (mission,index)=>{

            const number =
                index + 1;

            const div =
                document.createElement("div");

            div.className = "level";


            if(number === data.level){

                div.classList.add("current");

            }


            if(number > data.unlockedLevel){

                div.classList.add("locked");

            }


            div.innerHTML = `

                <b>
                    ${
                        number <= data.unlockedLevel
                        ? "✓"
                        : "🔒"
                    }
                </b>

                LEVEL ${number}

            `;


            box.appendChild(div);

        }
    );

}


/* TASK */

function completeTask(){

    const mission =
        currentMission();


    if(
        data.missionProgress >=
        mission.goal
    ){

        return;

    }


    data.missionProgress++;

    save();

    render();


    if(
        data.missionProgress >=
        mission.goal
    ){

        finishMission();

    }

}


/* FINISH */

function finishMission(){

    const mission =
        currentMission();


    data.credits +=
        mission.credits;

    data.xp +=
        mission.xp;


    if(
        data.level <
        missions.length
    ){

        data.level++;

        data.unlockedLevel =
            Math.max(
                data.unlockedLevel,
                data.level
            );

        data.missionProgress = 0;

    }


    save();

    render();

    showToast(
        "MISSION COMPLETE! +" +
        mission.xp +
        " XP"
    );

}


/* RESET */

function resetMission(){

    data.missionProgress = 0;

    save();

    render();

    showToast(
        "Mission reset"
    );

}


/* HOME */

function goHome(){

    window.location.href =
        "index.html";

}


/* TOAST */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.style.display =
        "block";


    setTimeout(()=>{

        toast.style.display =
            "none";

    },1800);

}


/* START */

render();

</script>

</body>
</html>
